version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
  exclusions:
    rules:
      - path: internal/worker/worker\.go
        linters:
          - gosec
        text: G404
      - linters:
          - bodyclose
        source: websocket\.Dial\(

formatters:
  enable:
    - gofumpt
    - goimports
