services:
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:8.10.3-alpine3.23
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 10

  fakeprovider:
    build: .
    command: ["fakeprovider"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.1
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      SUPPORTED_SUBMIT_METHODS: "[]"
    volumes:
      - ./api/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "8081:8080"

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10

  worker:
    build: .
    command: ["worker"]
    stop_grace_period: 40s
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      REDIS_URL: redis://redis:6379
      PROVIDER_URL: ${PROVIDER_URL:-http://fakeprovider:8081/}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fakeprovider:
        condition: service_healthy

  k6:
    image: grafana/k6:2.4.0
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/scripts:ro
    environment:
      - API_URL=http://api:8080
      - RATE
      - DURATION
      - BATCH
      - ROWS
      - BACKLOG
      - STREAMS
      - DUE_AFTER
