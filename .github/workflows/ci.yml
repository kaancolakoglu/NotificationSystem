name: ci

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Check every go.mod is tidy
        run: find . -name go.mod -exec dirname {} \; | xargs -I{} go -C {} mod tidy -diff
      - run: make lint
      - run: make test
