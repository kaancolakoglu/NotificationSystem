openapi: 3.0.3
info:
  title: Notification System API
  version: 1.0.0
paths:
  /v1/notifications:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: listNotifications
      summary: List notifications, newest first
      description: >-
        Every filter is optional and they combine with AND. The result is
        ordered by id, newest first. To read the next page, send the same
        filters with the cursor from the previous page.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: created_from
          in: query
          description: >-
            Only notifications created at or after this time. An RFC 3339
            time, or a date, which means midnight UTC. The range is matched
            against the creation time inside the id, which can differ from
            created_at by a few milliseconds.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: >-
            Only notifications created before this time. Matched like
            created_from.
          schema:
            type: string
            format: date-time
        - name: batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of notifications in one page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          description: >-
            The query string is malformed, or a parameter is not known, is
            not valid or is sent more than once: an unknown status or channel, a created_from or created_to that is not a
            time, a created_from that is not before created_to, a batch_id
            that is not a UUID, a limit outside 1 to 200, or a cursor that
            is not valid. An X-Correlation-ID that is not valid is rejected
            too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to read the notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createNotification
      summary: Create a notification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "202":
          description: The notification was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: >-
            The request body is not a valid JSON object, has a field that
            is not known or is of the wrong type, such as a scheduled_at
            that is not a date and time or a template_id that is not a UUID,
            or the Idempotency-Key is sent more than once or is not 1 to 255
            bytes long. A query parameter and an X-Correlation-ID that is
            not valid are rejected too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 1 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The notification failed validation, or its template is not
            known, is sent next to content, lacks a variable, or renders to
            more than 100 kB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to store the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/batch:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: createBatch
      summary: Create up to 1000 notifications
      description: >-
        Each notification is validated on its own. The valid ones are created
        together, and the others are reported with the reason. Rejected
        notifications are not stored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "202":
          description: At least one notification was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreated"
        "400":
          description: >-
            The request body is not a valid JSON object, has a field that
            is not known or is of the wrong type, such as a scheduled_at
            that is not a date and time or a template_id that is not a UUID,
            or the Idempotency-Key is sent more than once or is not 1 to 255
            bytes long. Such a field in one notification rejects the whole
            batch. A query parameter
            and an X-Correlation-ID that is not valid are rejected too.
            Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            No notification in the batch is valid, or the batch does not hold
            1 to 1000 notifications. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchRejected"
        "500":
          description: The server failed to store the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getNotification
      summary: Get a notification by id, with its delivery attempts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The notification and every delivery attempt made so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDetail"
        "400":
          description: >-
            The id is not a UUID, a query parameter was sent, or the
            X-Correlation-ID is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No notification has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to read the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: cancelNotification
      summary: Cancel a pending notification
      description: >-
        Only a pending notification can be cancelled. No attempt to send
        it starts after that. An earlier attempt whose result was lost may
        have reached the provider. The request has no body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The notification, now cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: >-
            The id is not a UUID, a query parameter was sent, or the
            X-Correlation-ID is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No notification has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The notification is not pending: it is being sent, was sent, has
            failed or was already cancelled. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to cancel the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/{id}/events:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: streamNotificationEvents
      summary: Stream the status changes of a notification over WebSocket
      description: >-
        A WebSocket endpoint. After the upgrade the server sends one text
        message for each status change of a notification: a StatusEvent
        as JSON.
        The client sends nothing, and a data message from the client
        closes the connection. Events are best effort and a stream has no
        history. So connect first, then fetch the status, and fetch it
        again after every reconnect. Events of one notification can
        arrive out of order. sent, failed and cancelled are final:
        ignore what arrives after one of them. The server closes the
        stream with code 1013 when events may have been missed: when it
        lost its connection to Redis, when 256 events wait for the
        client, or when the server stops. A client that reads nothing for 5 s is cut off without a
        close code. A handshake that is refused is answered in plain
        text, not with an Error object.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: >-
            The connection is now a WebSocket that carries StatusEvent
            messages.
        "400":
          description: >-
            The id is not a UUID, a query parameter was sent, or the
            X-Correlation-ID is not valid. A WebSocket handshake that
            is not valid is 400 too, in plain text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The Origin header names another host or port than the Host
            header, as a browser page of another site does. Answered in
            plain text.
        "404":
          description: No notification has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          description: >-
            The request does not ask for an upgrade to WebSocket.
            Answered in plain text.
        "500":
          description: The server failed to read the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The server is not connected to Redis, so it has no events to
            send. Try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/templates:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    post:
      operationId: createTemplate
      summary: Create a template
      description: >-
        A template is text with placeholders, for any channel. A create
        request for a notification names it with template_id and gives the
        values with variables. A template cannot be read, listed, changed
        or deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: The template was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: >-
            The request body is not a valid JSON object, or has a field that
            is not known or is of the wrong type. A query parameter and an
            X-Correlation-ID that is not valid are rejected too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 1 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The content is empty, has a NUL character, or has double braces
            that are not a placeholder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to store the template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/batches/{id}:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: getBatch
      summary: Get the status counts of a batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: How many notifications of the batch are in each status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          description: >-
            The id is not a UUID, a query parameter was sent, or the
            X-Correlation-ID is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No batch has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to read the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/batches/{id}/events:
    parameters:
      - $ref: "#/components/parameters/CorrelationId"
    get:
      operationId: streamBatchEvents
      summary: Stream the status changes of a batch over WebSocket
      description: >-
        A WebSocket endpoint. After the upgrade the server sends one text
        message for each status change of every notification of a batch:
        a StatusEvent as JSON.
        The client sends nothing, and a data message from the client
        closes the connection. Events are best effort and a stream has no
        history. So connect first, then fetch the status, and fetch it
        again after every reconnect. Events of one notification can
        arrive out of order. sent, failed and cancelled are final:
        ignore what arrives after one of them. The server closes the
        stream with code 1013 when events may have been missed: when it
        lost its connection to Redis, when 256 events wait for the
        client, or when the server stops. A client that reads nothing for 5 s is cut off without a
        close code. A handshake that is refused is answered in plain
        text, not with an Error object.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: >-
            The connection is now a WebSocket that carries StatusEvent
            messages.
        "400":
          description: >-
            The id is not a UUID, a query parameter was sent, or the
            X-Correlation-ID is not valid. A WebSocket handshake that
            is not valid is 400 too, in plain text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The Origin header names another host or port than the Host
            header, as a browser page of another site does. Answered in
            plain text.
        "404":
          description: No batch has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "426":
          description: >-
            The request does not ask for an upgrade to WebSocket.
            Answered in plain text.
        "500":
          description: The server failed to read the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The server is not connected to Redis, so it has no events to
            send. Try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      description: >-
        Names the request in the logs. It is 1 to 128 printable ASCII
        characters without spaces, sent once. Any other value is answered
        with 400. If it is not sent, or is not valid, the server generates
        one. Every response carries the id that was used, in the same
        header. It is stored with each notification the request creates
        and appears in the log lines of their delivery. A replay with an
        Idempotency-Key creates nothing, so the notification keeps the id
        of the first request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[!-~]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        Makes the request safe to retry. A repeat with the same key and the
        same body returns the first response and creates nothing. A key is
        kept for at least 24 hours. Once it is deleted, a request with that
        key is handled as a new one.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
    Status:
      type: string
      enum: [pending, processing, sent, failed, cancelled]
    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [recipient, channel]
      properties:
        recipient:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          type: string
          x-go-type-skip-optional-pointer: true
          description: >-
            The text to send. Required unless template_id is sent. Send
            content or template_id, not both.
        template_id:
          type: string
          format: uuid
          description: >-
            The template to render into the content. The rendered text is
            stored on the notification and checked like content.
        variables:
          type: object
          additionalProperties:
            type: string
            nullable: true
          x-go-type-skip-optional-pointer: true
          description: >-
            The value of each placeholder of the template, by name. A
            placeholder without a value is rejected, and null is no value.
            A value without a placeholder is not used.
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          default: normal
        scheduled_at:
          type: string
          format: date-time
          description: >-
            Do not send before this time, an RFC 3339 date and time. Without
            it, or with a time in the past, the notification is due at once.
            Until its time the notification is pending and can be cancelled.
            The response does not include it.
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: >-
            The text of the template. A placeholder is a name in double
            braces, such as {{name}}. A name has ASCII letters, digits and
            underscores. Any other {{ or }} is rejected. The only size
            limit is the request body, but the rendered text must fit the
            channel it is sent on.
    Template:
      type: object
      required: [id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
    Notification:
      type: object
      required: [id, recipient, channel, content, priority, status, created_at, attempts]
      properties:
        id:
          type: string
          format: uuid
        recipient:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        batch_id:
          type: string
          format: uuid
          description: Present when the notification was created in a batch.
        attempts:
          type: integer
          description: >-
            How many times a worker has taken the notification to send it.
            An attempt in progress is counted.
        last_error:
          type: string
          description: >-
            The error of the last failed or lost attempt. It stays after a
            later attempt succeeds.
    DeliveryAttempt:
      type: object
      required: [attempt, created_at]
      properties:
        attempt:
          type: integer
          description: Number of the attempt, from 1.
        error:
          type: string
          description: >-
            Present when the attempt failed or was lost. `lease expired
            before a result was stored` means the worker lost the attempt:
            the provider may never have been called, or may have accepted
            it.
        created_at:
          type: string
          format: date-time
          description: >-
            When the result of the attempt was stored, or when the attempt
            was found lost.
    NotificationDetail:
      allOf:
        - $ref: "#/components/schemas/Notification"
        - type: object
          required: [delivery_attempts]
          properties:
            delivery_attempts:
              type: array
              description: >-
                Oldest first. An attempt appears once its result is stored,
                or once it is found lost.
              items:
                $ref: "#/components/schemas/DeliveryAttempt"
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          description: Present when there may be another page.
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CreateNotificationRequest"
    BatchItemResult:
      type: object
      description: >-
        The outcome for the notification at one position of the request. An
        accepted one has an id, a rejected one has an error.
      required: [index]
      properties:
        index:
          type: integer
          description: Position of the notification in the request, from 0.
        id:
          type: string
          format: uuid
        error:
          type: string
    BatchCreated:
      type: object
      required: [batch_id, results]
      properties:
        batch_id:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchItemResult"
    BatchRejected:
      type: object
      required: [message]
      properties:
        message:
          type: string
        results:
          type: array
          description: Present when every notification failed validation.
          items:
            $ref: "#/components/schemas/BatchItemResult"
    Batch:
      type: object
      description: Counts cover the accepted notifications of the batch.
      required: [id, total, pending, processing, sent, failed, cancelled]
      properties:
        id:
          type: string
          format: uuid
        total:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        processing:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64
    StatusEvent:
      type: object
      description: >-
        One status change of a notification, sent as a text message on a
        WebSocket stream. A notification that is created is not an event.
      required: [notification_id, status, attempts]
      properties:
        notification_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
          description: Present when the notification was created in a batch.
        status:
          allOf:
            - $ref: "#/components/schemas/Status"
          description: The status the notification changed to.
        attempts:
          type: integer
          description: >-
            The attempts of the notification after the change. A
            notification that a worker gave up before its provider call
            has the attempt refunded. One whose attempt was lost keeps
            it.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
