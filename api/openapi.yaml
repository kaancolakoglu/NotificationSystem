openapi: 3.0.3
info:
  title: Notification System API
  version: 1.0.0
paths:
  /v1/notifications:
    post:
      operationId: createNotification
      summary: Create a notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "202":
          description: The notification was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: The request body is not a valid JSON object, or has a field of the wrong type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 1 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The notification failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to store the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
    Status:
      type: string
      enum: [pending, processing, sent, failed, cancelled]
    CreateNotificationRequest:
      type: object
      required: [recipient, channel, content]
      properties:
        recipient:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          type: string
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          default: normal
    Notification:
      type: object
      required: [id, recipient, channel, content, priority, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        recipient:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
