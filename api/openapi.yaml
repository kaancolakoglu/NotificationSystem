openapi: 3.0.3
info:
  title: Notification System API
  version: 1.0.0
paths:
  /v1/notifications:
    get:
      operationId: listNotifications
      summary: List notifications, newest first
      description: >-
        Every filter is optional and they combine with AND. The result is
        ordered by id, newest first. To read the next page, send the same
        filters with the cursor from the previous page.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: created_from
          in: query
          description: >-
            Only notifications created at or after this time. An RFC 3339
            time, or a date, which means midnight UTC. The range is matched
            against the creation time inside the id, which can differ from
            created_at by a few milliseconds.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: >-
            Only notifications created before this time. Matched like
            created_from.
          schema:
            type: string
            format: date-time
        - name: batch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The largest number of notifications in one page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The next_cursor of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          description: >-
            The query string is malformed, or a parameter is not known, is
            not valid or is sent more than once: an unknown status or channel, a created_from or created_to that is not a
            time, a created_from that is not before created_to, a batch_id
            that is not a UUID, a limit outside 1 to 200, or a cursor that
            is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to read the notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createNotification
      summary: Create a notification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "202":
          description: The notification was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: >-
            The request body is not a valid JSON object, has a field that
            is not known or is of the wrong type, or the Idempotency-Key is
            sent more than once or is not 1 to 255 bytes long. A query
            parameter is rejected too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 1 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The notification failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to store the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/batch:
    post:
      operationId: createBatch
      summary: Create up to 1000 notifications
      description: >-
        Each notification is validated on its own. The valid ones are created
        together, and the others are reported with the reason. Rejected
        notifications are not stored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "202":
          description: At least one notification was accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreated"
        "400":
          description: >-
            The request body is not a valid JSON object, has a field that
            is not known or is of the wrong type, or the Idempotency-Key is
            sent more than once or is not 1 to 255 bytes long. Such a field
            in one notification rejects the whole batch. A query parameter
            is rejected too. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 10 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            No notification in the batch is valid, or the batch does not hold
            1 to 1000 notifications. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchRejected"
        "500":
          description: The server failed to store the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/{id}:
    get:
      operationId: getNotification
      summary: Get a notification by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: The id is not a UUID, or a query parameter was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No notification has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to read the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/notifications/{id}/cancel:
    post:
      operationId: cancelNotification
      summary: Cancel a pending notification
      description: >-
        Only a pending notification can be cancelled. A cancelled
        notification is never sent. The request has no body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The notification, now cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: The id is not a UUID, or a query parameter was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No notification has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The notification is not pending: it is being sent, was sent, has
            failed or was already cancelled. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to cancel the notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/batches/{id}:
    get:
      operationId: getBatch
      summary: Get the status counts of a batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: How many notifications of the batch are in each status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          description: The id is not a UUID, or a query parameter was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No batch has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server failed to read the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        Makes the request safe to retry. A repeat with the same key and the
        same body returns the first response and creates nothing.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
    Status:
      type: string
      enum: [pending, processing, sent, failed, cancelled]
    CreateNotificationRequest:
      type: object
      additionalProperties: false
      required: [recipient, channel, content]
      properties:
        recipient:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          type: string
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          default: normal
    Notification:
      type: object
      required: [id, recipient, channel, content, priority, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        recipient:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        content:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/Status"
        created_at:
          type: string
          format: date-time
        batch_id:
          type: string
          format: uuid
          description: Present when the notification was created in a batch.
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          description: Present when there may be another page.
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CreateNotificationRequest"
    BatchItemResult:
      type: object
      description: >-
        The outcome for the notification at one position of the request. An
        accepted one has an id, a rejected one has an error.
      required: [index]
      properties:
        index:
          type: integer
          description: Position of the notification in the request, from 0.
        id:
          type: string
          format: uuid
        error:
          type: string
    BatchCreated:
      type: object
      required: [batch_id, results]
      properties:
        batch_id:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchItemResult"
    BatchRejected:
      type: object
      required: [message]
      properties:
        message:
          type: string
        results:
          type: array
          description: Present when every notification failed validation.
          items:
            $ref: "#/components/schemas/BatchItemResult"
    Batch:
      type: object
      description: Counts cover the accepted notifications of the batch.
      required: [id, total, pending, processing, sent, failed, cancelled]
      properties:
        id:
          type: string
          format: uuid
        total:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        processing:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
